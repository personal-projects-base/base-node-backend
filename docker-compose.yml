services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host localhost --eval 'try { rs.status().ok } catch (error) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}).ok }' | grep 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      APP_NAME: "${APP_NAME:-base-node-backend}"
      APP_DISPLAY_NAME: "${APP_DISPLAY_NAME:-Base Node Backend}"
      HOST: 0.0.0.0
      PORT: "${PORT:-3000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      REQUEST_LOG_ENABLED: "true"
      HELMET_ENABLED: "true"
      CORS_ENABLED: "true"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:4200,http://localhost:5173}"
      CORS_CREDENTIALS: "${CORS_CREDENTIALS:-false}"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "100"
      TRUST_PROXY_HOPS: "0"
      DATABASE_URL: "mongodb://mongodb:27017/${MONGODB_DATABASE:-base_node}?replicaSet=rs0&directConnection=true"
      PRISMA_DEPLOY_MODE: push
      POSTGRES_NATIVE_ENABLED: "false"
      MONGODB_ENABLED: "false"
      MONGODB_URL: "mongodb://mongodb:27017/${MONGODB_DATABASE:-base_node}?replicaSet=rs0&directConnection=true"
      MONGODB_DATABASE: "${MONGODB_DATABASE:-base_node}"
      RABBITMQ_ENABLED: "false"
      RABBITMQ_URL: amqp://base_node:base_node_change_me@rabbitmq:5672
      RABBITMQ_EXCHANGE: "${RABBITMQ_EXCHANGE:-base.node.events}"
      RABBITMQ_REQUEUE_ON_ERROR: "false"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
